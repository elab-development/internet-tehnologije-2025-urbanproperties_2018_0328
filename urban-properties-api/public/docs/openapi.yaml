      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUsersResponse"
        "403":
          description: Forbidden (not admin)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/reports:
    get:
      tags: [Admin]
      summary: Admin reports (date range + optional sales_agent_id/city)
      parameters:
        - in: query
          name: date_from
          required: true
          schema: { type: string, format: date }
        - in: query
          name: date_to
          required: true
          schema: { type: string, format: date }
        - in: query
          name: sales_agent_id
          required: false
          schema: { type: integer }
        - in: query
          name: city
          required: false
          schema: { type: string, maxLength: 80 }
      responses:
